# Removes older plugins-* releases, keeping only the newest complete one (the one /releases/latest points to).
name: Remove older plugin releases
on:
  push:
    branches: [ builds ]
    paths: [ CLEANUP ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove older plugin releases
        env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          keep=$(gh api repos/$R/releases/latest -q .tag_name)
          echo "keeping $keep"
          gh api repos/$R/releases --paginate -q '.[].tag_name' | grep '^plugins-' | grep -vx "$keep" | while read -r t; do
            gh release delete "$t" --repo "$R" --yes --cleanup-tag && echo "removed $t"
          done
