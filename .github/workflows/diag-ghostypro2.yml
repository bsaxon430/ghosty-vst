# Diagnostic: builds Ghosty Pro 2's console tool exactly the way the release builds the plug-in, for a test on a real Mac.
name: Diag Ghosty Pro 2 tool
on:
  push:
    branches: [ builds ]
    paths: [ DIAG ]
permissions:
  contents: write
jobs:
  tool:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag/ghostypro2 }
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 > cfg.log 2>&1 || { tail -50 cfg.log; exit 1; }
          cmake --build build --config Release --parallel 3 --target GhostyProTool > b.log 2>&1 || { grep -E "error:" b.log | head -30; exit 1; }
          T=$(find build -name GhostyProTool -type f -perm -u+x | head -1); lipo -archs "$T"; codesign --force --sign - "$T"
          ditto -c -k "$T" GhostyProTool-github.zip
          gh release delete diag-ghostypro2 --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create diag-ghostypro2 GhostyProTool-github.zip --repo "${{ github.repository }}" --prerelease --title "diagnostic (not a release)" --notes "Diagnostic build for testing; not for use."
        env: { GH_TOKEN: "${{ github.token }}" }
